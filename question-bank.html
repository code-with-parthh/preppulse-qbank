<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank | PrepDeck</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/student dashboard.css" rel="stylesheet">
</head><body>
<aside class="sidebar offcanvas-lg offcanvas-start" id="sidebar" tabindex="-1"><div class="brand"><span class="brand-mark"><i class="bi bi-layers-fill"></i></span>PrepDeck<button class="btn-close d-lg-none ms-auto" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close"></button></div><nav class="nav-list"><a href="student dashboard.html" class="nav-item-pd"><i class="bi bi-grid-1x2"></i>Dashboard</a><a href="question-bank.html" class="nav-item-pd active"><i class="bi bi-journal-text"></i>Question Bank</a><a href="student dashboard.html#progress" class="nav-item-pd"><i class="bi bi-graph-up-arrow"></i>My Progress</a><a href="student dashboard.html#bookmarks" class="nav-item-pd"><i class="bi bi-bookmark"></i>Bookmarks</a></nav></aside>
<div class="main"><header class="topbar"><button class="icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-label="Open menu"><i class="bi bi-list"></i></button><a class="name" href="student dashboard.html">PrepDeck</a><div class="ms-auto text-muted small" id="studentName"></div></header>
<main class="content"><section class="welcome"><div><p class="date">PRACTICE LIBRARY</p><h1>Question Bank</h1><p class="sub">Browse interview questions, study explanations, and track what you have practiced.</p></div><div class="stat"><div><p class="stat-label">Questions available</p><p class="stat-num" id="totalCount">240</p></div></div></section>
<section class="card-pd mb-3"><div class="bank-filters"><label class="bank-search"><span class="visually-hidden">Search questions</span><i class="bi bi-search"></i><input id="bankSearch" type="search" placeholder="Search questions or topics"></label><label><span class="visually-hidden">Category</span><select id="categoryFilter" class="form-select"><option value="">All categories</option></select></label><label><span class="visually-hidden">Difficulty</span><select id="difficultyFilter" class="form-select"><option value="">All difficulties</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label></div><div class="filter-summary" id="resultSummary"></div></section>
<div class="row g-3" id="questionList"></div><div class="text-center py-4"><button id="loadMore" class="btn-soft">Load more</button></div></main></div>
<div class="toast-wrap"><div id="toast" class="toast pd-toast" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/questions.js"></script><script src="js/prepdeck-data.js"></script><script src="js/question-bank.js"></script>
</body></html>
