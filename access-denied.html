<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied | PrepDeck</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/student-dashboard.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

  <div class="card-pd text-center p-5 shadow-sm" style="max-width: 520px; width: 90%;">
    <div class="mb-3">
      <span class="d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 72px; height: 72px; background: #fee2e2; color: #dc2626; font-size: 2rem;">
        <i class="bi bi-shield-lock-fill"></i>
      </span>
    </div>
    <h1 class="h3 fw-bold text-dark mb-2">Access Restricted</h1>
    <p class="text-muted mb-4" style="font-size: 0.95rem;">
      You are currently signed in as a <strong>Student</strong>. Mentor privileges are required to view the Review Queue and manage the Question Bank.
    </p>

    <div class="d-grid gap-2">
      <a href="student-dashboard.html" class="btn btn-pd">
        <i class="bi bi-arrow-left"></i> Return to Student Dashboard
      </a>
      <button type="button" class="btn btn-outline-warning text-dark fw-bold" id="switchToMentorBtn">
        <i class="bi bi-person-badge"></i> Switch to Mentor (Ms. Rao Demo)
      </button>
      <a href="student-login.html" class="btn btn-soft text-muted">
        Sign Out & Switch Account
      </a>
    </div>
    <p class="text-muted small mt-4 mb-0">PrepPulse QBANK (PST_PD_113) • Role-Based Demo Protection</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.getElementById('switchToMentorBtn').addEventListener('click', () => {
      Storage.switchUser('u_rao');
      Components.showToast('Switched to Mentor: Ms. Rao');
      setTimeout(() => {
        window.location.href = 'mentor-dashboard.html';
      }, 300);
    });
  </script>
</body>
</html>
